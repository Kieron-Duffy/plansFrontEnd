#############################
    ### HTTP Security Headers ###
    #############################

    ### Quick Reference: https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html#security-headers
    ###                  https://fetch.spec.whatwg.org/#terminology-headers

    ### X-Frame-Options
    ###
    ### The HTTP X-Frame-Options response header can be used to indicate whether a browser should be allowed to render a page in a <frame>, <iframe>, <embed> or <object>.
    ### Sites can use this to avoid clickjacking attacks, by ensuring that their content is not embedded into other sites.
    ### Note: X-Frame-Options is less configurable than CSP-Frame Ancestors but provides support for legacy browsers which do not support CSP’s.
    ### If framing is required by a non-SAME-ORIGIN then this header will require removing else legacy browsers will fail.
    ### Where a frame-ancestors directive exists, modern browsers should ignore the X-Frame-Options directive.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Frame-Options
    ###
    ### DENY:       The page cannot be displayed in a frame, regardless of the site attempting to do so.
    ###             Not only will the browser attempt to load the page in a frame fail when loaded from other sites, attempts to do so will fail when loaded from the same site.
    ### SAMEORIGIN: The page can only be displayed if all ancestor frames are same origin to the page itself.
    ###             You can still use the page in a frame as long as the site including it in a frame is the same as the one serving the page.

    add_header X-Frame-Options "SAMEORIGIN" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Cache-Control
    ###
    ### The HTTP Cache-Control header holds directives (instructions) in both requests and responses that control caching in browsers and shared caches (e.g., Proxies, CDNs).
    ### Providing no-store indicates that any caches of any kind (private or shared) should not store the response that contains the header.
    ### A browser must make a new request every time the API is called to fetch the latest response.
    ### This header with a no-store value prevents sensitive information from being cached or stored.
    ### While this typically only affects GET requests other methods may be cacheable through misconfiguration and so should be included everywhere.
    ### no-store, must-revalidate, pragma: no-cache and expires: 0 is to ensure legacy browser coverage.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Pragma
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Expires
    ###
    ### Cache-Control: no-store, no-cache, must-revalidate
    ### Pragma: no-cache
    ### Expires: 0
    ### Where sensitive data is rendered server-side, appropriate cache-control headers must be present to ensure content freshness.
    ### This limits CDN and browser caching, helping to prevent the accidental exposure of other users' data.

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Content-Type
    ###
    ### The Content-Type header indicates the media type (MIME type) of the resource's content, allowing the client to understand how to process or render the data.
    ### It reflects the type of the original content, not any content encoding (like compression) applied during transmission.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Type
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Accept
    ###
    ### text/html; charset=utf-8 : This part of the header tells the browser that the response contains HTML content.
    ###                            It ensures the browser interprets the response as a web page and renders it accordingly.
    ###                            Despite referencing text/html, this will support a page load with images, css and js.
    ###                            The character encoding UTF-8 is the most widely used encoding on the web.
    ###
    ### Note: Avoid removing Charset as this may cause XSS or broken characters, do not write logic to reflect/echo the request – always explicitly specify content-types

    ### The `add_header Content-Type "text/html; charset=utf-8" always;` directive in securityheaders.conf was overriding the Content-Type for every response — including .js bundles — 
    ### forcing them to be served as text/html. With strict MIME checking enabled, the browser refused to execute scripts that were not served as application/javascript.
    ### Nginx's built-in mime.types table already sets the correct Content-Type per file extension, so no replacement header is needed.
    
    # add_header Content-Type "text/html; charset=utf-8" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### X-Content-Type-Options
    ###
    ### The HTTP X-Content-Type-Options response header indicates that the MIME types advertised in the Content-Type headers should be respected and not changed.
    ### In HTTP responses, the Content-Type header tells the client the media type of the returned content (e.g., text/html, application/json).
    ### However, some browsers may ignore this and attempt to "sniff" the content type based on the content itself a behaviour known as MIME sniffing.
    ### This can lead to security vulnerabilities, such as cross-site scripting (XSS), if a browser misinterprets the content.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Content-Type-Options
    ### https://fetch.spec.whatwg.org/#should-response-to-request-be-blocked-due-to-nosniff?
    ###
    ### nosniff : The X-Content-Type-Options header should be set to nosniff.
    ###           This instructs browsers to strictly follow the declared Content-Type and not attempt MIME sniffing.

    add_header X-Content-Type-Options "nosniff" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Strict-Transport-Security
    ###
    ### The Strict-Transport-Security HTTP response header tells browsers that the website should only be accessed using HTTPS, never HTTP.
    ### Once a browser sees this header, it will automatically convert all future HTTP requests to HTTPS for that domain — even if the user types “http://” or clicks an insecure link.
    ### The header:
    ### - Prevents downgrade attacks (e.g., SSL stripping)
    ### - Enforces secure connections for all future visits
    ### - Protects API calls from being intercepted over insecure HTTP
    ### - Reduces risk of spoofed certificates by ensuring HTTPS is always used
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Strict-Transport-Security
    ###
    ### max-age=31536000 : Enforces HSTS for 1 year before requiring re-validation.
    ###
    ### Note: Preferred – do not add preload or includeSubDomains as this can affect sites that are owned by other teams. Preload can be very hard to undo.

    add_header Strict-Transport-Security "max-age=31536000" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Referrer-Policy
    ###
    ### The HTTP Referrer-Policy response header controls how much referrer information (sent with the Referer header) should be included with requests.
    ### Aside from the HTTP header, you can set this policy in HTML.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Referrer-Policy
    ###
    ### strict-origin-when-cross-origin : Send the origin, path, and query string when performing a same-origin request.
    ###                                   For cross-origin requests send the origin (only) when the protocol security level stays same (HTTPS→HTTPS).
    ###                                   Don't send the Referer header to less secure destinations (HTTPS→HTTP).
    ### no-referrer: Optional – The Referer header will be omitted: sent requests do not include any referrer information.
    ###                         Note that this could break certain telemetry requirements for Adobe Analytics and other analytical requests.

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Access-Control-Allow-Origin
    ###
    ### The HTTP Access-Control-Allow-Origin response header indicates whether the response can be shared with requesting code from the given origin.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Access-Control-Allow-Origin
    ###
    ### Example: A response that tells the browser to allow requesting code from the origin https://developer.mozilla.org to access a resource.
    ###          Amend below to include your domain:

    # add_header Access-Control-Allow-Origin https://developer.mozilla.org;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Server Identifiers
    ###
    ### Server/Technology identifying headers where not required must be removed.
    ### Attackers may utilise this data to collect information about services that help identify vulnerabilities.
    ###
    ### https://owasp.org/www-project-secure-headers/index.html#prevent-information-disclosure-via-http-headers
    ###
    ### X-Powered-By, Server : Ensure all identifiers to technology stack are removed from headers.

    proxy_hide_header X-Powered-By; 
    proxy_hide_header Server;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Permissions-Policy
    ###
    ### Permissions-Policy allows you to control which origins can use which browser features, both in the top-level page and in embedded frames.
    ### For every feature controlled by Feature Policy, the feature is only enabled in the current document or frame if its origin matches the allowed list of origins.
    ### This means that you can configure your site to never allow the camera or microphone to be activated.
    ### This prevents that an injection, for example an XSS, enables the camera, the microphone, or other browser feature.
    ### Note –> Feature policy is now Deprecated on modern browsers, but should be included to account for browsers that do not yet support
    ### Note –> These policies are much broader and only privacy controls have been specified, review the MDN resource for any additional protections e.g. clipboard protection.
    ###
    ### Permissions-Policy: microphone=(), geolocation=(), camera=()
    ### Feature-Policy: microphone 'none'; geolocation 'none'; camera 'none'
    ### - Ensure all identifiers to technology stack are removed from headers.

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    # Legacy support
    # add_header Feature-Policy "geolocation 'none'; microphone 'none'; camera 'none'" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Vary
    ###
    ### The HTTP Vary response header describes the parts of the request message (aside from the method and URL) that influenced the content of the response it occurs in.
    ### Including a Vary header ensures that responses are separately cached based on the headers listed in the Vary field.
    ### Most often, this is used to create a cache key when content negotiation is in use.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Vary
    ###
    ###

    add_header Vary "Accept-Encoding, Origin" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### X-Permitted-Cross-Domain-Policies
    ###
    ### The HTTP X-Permitted-Cross-Domain-Policies response header defines a meta-policy that controls whether site resources can be accessed cross-origin by a document running in a web client like Adobe Acrobat or Microsoft Silverlight.
    ### It can be used in cases where the website needs to declare a cross-domain policy, but cannot write to the root directory of the domain.
    ### Usage of this header is less common since Adobe Flash Player and Microsoft Silverlight have been deprecated.
    ### Some security testing tools will still check for the presence of a X-Permitted-Cross-Domain-Policies: none header because it can mitigate the risk of an overly-permissive policy file added to your site by accident or through malicious actions.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Permitted-Cross-Domain-Policies
    ###
    ### none : No policy files are allowed anywhere on the target server, including in a master policy file.

    add_header X-Permitted-Cross-Domain-Policies "none" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Content-Security-Policy
    ###
    ### The HTTP Content-Security-Policy response header allows website administrators to control resources the user agent is allowed to load for a given page.
    ### With a few exceptions, policies mostly involve specifying server origins and script endpoints. This helps guard against cross-site scripting attacks.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
    ###
    ### CSP is complicated and individual team will have to configure based on its own requirements

    # add_header Content-Security-Policy "frame-ancestors 'self'" always;

    ### ------------------------------------------------------------------------------------------------------------------------------------------------------------------

    ### Content-Encoding
    ###
    ### The HTTP Content-Encoding representation header lists the encodings and the order in which they have been applied to a resource.
    ### This lets the recipient know how to decode the data in order to obtain the original content format described in the Content-Type header.
    ### Content encoding is mainly used to compress content without losing information about the original media type.
    ###
    ### https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Encoding
    ###
    ### gzip : A format using the Lempel-Ziv coding (LZ77), with a 32-bit CRC. This is the original format of the UNIX gzip program.
    ###        The HTTP/1.1 standard also recommends that the servers supporting this content-encoding should recognize x-gzip as an alias, for compatibility purposes.

    # add_header Content-Encoding gzip;

    ### End of Security Headers